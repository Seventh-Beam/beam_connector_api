syntax = "proto3";

package payment.v1;

option go_package = "github.com/setldpay/pays_connector/api/payment/v1;paymentv1";
option java_package = "com.setldpay.sdk";

// PaymentService provides payment processing capabilities
service PaymentService {
  // Get Card Not Present Details
  rpc GetCardDetails(CardDetailsRequest) returns (CardDetails);

  // Get Account Tokens
  rpc GetAccountTokens(CardRequest) returns (AccountTokens);

  // Get Apple Token
  rpc GetAppleToken(AppleTokenRequest) returns (AppleToken);

  // Get Google Token
  rpc GetGoogleToken(GoogleTokenRequest) returns (GoogleToken);

  // Retrieve Pin
  rpc GetAccountPin(CardRequest) returns (AccountPin);

  // Get Account Details
  rpc GetAccountDetails(CardRequest) returns (AccountDetails);

  // Get Account Transactions
  rpc GetAccountTransactions(PagedCardRequest) returns (PagedAccountTransactions);
}

// Card Request
message CardRequest {
  string cardId = 1;
}

// Card Details Request
message CardDetailsRequest {
  string cardId = 1;
  optional string locale = 2;
}

message AppleTokenRequest {
  string cardId = 1;
  repeated bytes deviceCertChain = 2;
  bytes nonce = 3;
  bytes nonceSignature = 4;
}

message GoogleTokenRequest {
  string cardId = 1;
  string deviceId = 2;
  string clientCustomerId = 3;
  string sessionId = 4;
  string provisionMode = 5;
}

// Paged Card Request
message PagedCardRequest {
  string cardId = 1;

  int32 offset = 2;

  int32 limit = 3;
}

// Card Details Response
message CardDetails {
  string cardDetailsUrl = 1;
}

// Account Tokens Response
message AccountTokens {
  repeated AccountToken tokens = 1;
}

message AccountToken {
  string cardTokenId = 1;
  string cardId = 2;
  string expiryYear = 3;
  string expiryMonth = 4;
  string tokenStatus = 5;
  string tokenRequestorId = 6;
  string tokenUniqueReference = 7;
  string panUniqueReference = 8;
}

// Google Token
message GoogleToken {
  string last4 = 1;
  string paymentAccountReference = 2;
  string googleOpaquePaymentCard = 3;
  string opaquePaymentCard = 4;
  string encAddress = 5;
  string exp = 6;
}

// Apple Token
message AppleToken {
  bytes activationData = 1;
  bytes encryptedPassData = 2;
  bytes ephemeralPublicKey = 3;
  string paymentAccountReference = 4;
}

// Account Pin
message AccountPin{
  string pin = 1;
}

message AccountBalance {
  string balanceTimestamp = 1;
  string currencyCode = 2;
  double availableBalance = 3;
  double settledBalance = 4;
  double reservedBalance = 5;
}

// Account Details
message AccountDetails {
  string cardExtRef = 1;
  string createdDate = 2;
  string designId = 3;
  string accountId = 4;
  string maskedPan = 5;
  string status = 6;
  bool isActive = 7;
  AccountBalance balance = 8;
  int64 id = 9;
}

message Transaction {
  string transactionId = 1;
  int64 amountCents = 2;
  string description = 3;
  string status = 4;
}

// Account Transactions
message PagedAccountTransactions {
  int32 offset = 1;
  int32 limit = 2;

  repeated Transaction transactions = 3;
}

// Error represents an error response
message Error {
  // Error code
  string code = 1;
  
  // Human-readable error message
  string message = 2;
  
  // Detailed error information for debugging
  string details = 3;
  
  // HTTP status code equivalent
  int32 httpStatus = 4;
}
